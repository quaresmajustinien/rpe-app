<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#185FA5">
<title>RPE Coach</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --blue-dark: #0C447C;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --orange: #BA7517;
    --orange-light: #FAEEDA;
    --red: #791F1F;
    --red-light: #FCEBEB;
    --text: #1a1a1a;
    --text-2: #555;
    --text-3: #999;
    --border: #e0e0e0;
    --bg: #f5f5f5;
    --white: #fff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* LOGIN */
  .login-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 32px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo-icon { width: 72px; height: 72px; border-radius: 20px; background: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .logo h1 { font-size: 24px; font-weight: 600; color: var(--text); }
  .logo p { font-size: 14px; color: var(--text-2); text-align: center; }
  .form-card { width: 100%; max-width: 360px; background: var(--white); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
  .form-card h2 { font-size: 18px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .field input { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; color: var(--text); background: var(--white); }
  .field input:focus { outline: none; border-color: var(--blue); }
  .btn-primary { padding: 12px; border-radius: var(--radius-sm); background: var(--blue); color: #fff; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary:active { background: var(--blue-dark); }
  .btn-ghost { padding: 10px; border-radius: var(--radius-sm); background: none; color: var(--blue); border: none; font-size: 14px; cursor: pointer; font-family: inherit; }
  .switch-link { font-size: 13px; color: var(--text-3); text-align: center; }
  .switch-link span { color: var(--blue); cursor: pointer; font-weight: 500; }
  .error-msg { font-size: 13px; color: #c0392b; background: #fdecea; padding: 8px 12px; border-radius: var(--radius-sm); display: none; }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>RPE Coach</h1>
      <p>Suivi de charge d'entraînement</p>
    </div>
    <div class="form-card" id="form-login">
      <h2>Connexion</h2>
      <div class="error-msg" id="login-error"></div>
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="ton@email.com" autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-primary" onclick="doLogin()">Se connecter</button>
      <div class="switch-link">Première fois ? <span onclick="showRegister()">Créer un compte</span></div>
    </div>
    <div class="form-card" id="form-register" style="display:none">
      <h2>Créer mon compte</h2>
      <div class="error-msg" id="register-error"></div>
      <div class="field"><label>Mon prénom et nom</label><input type="text" id="reg-name" placeholder="Thomas Mercier" autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="ton@email.com" autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="btn-primary" onclick="doRegister()">Créer mon compte</button>
      <div class="switch-link">Déjà un compte ? <span onclick="showLogin()">Se connecter</span></div>
    </div>
  </div>
</div>

<script>
const API = '';

function showRegister() {
  document.getElementById('form-login').style.display = 'none';
  document.getElementById('form-register').style.display = 'flex';
  document.getElementById('form-register').style.flexDirection = 'column';
}
function showLogin() {
  document.getElementById('form-register').style.display = 'none';
  document.getElementById('form-login').style.display = 'flex';
  document.getElementById('form-login').style.flexDirection = 'column';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.remove('show');
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error; errEl.classList.add('show'); return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    if (data.user.role === 'admin') window.location.href = '/admin.html';
    else window.location.href = '/athlete.html';
  } catch(e) { errEl.textContent = 'Erreur de connexion au serveur'; errEl.classList.add('show'); }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('register-error');
  errEl.classList.remove('show');
  if (!name || !email || !password) { errEl.textContent = 'Tous les champs sont requis'; errEl.classList.add('show'); return; }
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error; errEl.classList.add('show'); return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/athlete.html';
  } catch(e) { errEl.textContent = 'Erreur de connexion au serveur'; errEl.classList.add('show'); }
}

// Auto-redirect si déjà connecté
const tok = localStorage.getItem('token');
const usr = JSON.parse(localStorage.getItem('user') || 'null');
if (tok && usr) {
  if (usr.role === 'admin') window.location.href = '/admin.html';
  else window.location.href = '/athlete.html';
}
</script>
</body>
</html>
